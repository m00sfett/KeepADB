name: CI

# Manual-only (#575, follow-up to #327): project policy accepts PRs and development commits
# through the local gate `bin/verify`, so neither `push` nor `pull_request` starts this workflow
# automatically. Every run is started explicitly via `workflow_dispatch` and needs its own
# approval, which keeps the shared GitHub Actions minute quota for deliberate checks only.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check translation consistency
        run: python3 bin/check-i18n

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Lint, Test & Assemble Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Assemble Release APK (R8/resource shrinking)
        run: ./gradlew assembleRelease
