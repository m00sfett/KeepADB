name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag and version metadata consistency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref_name="$RELEASE_TAG"
          if [[ -z "$ref_name" ]]; then
            echo "::error::Release tag is empty"
            exit 1
          fi

          tag_version="${ref_name#v}"
          if [[ -z "$tag_version" || "$tag_version" == "$ref_name" ]]; then
            echo "::error::Release tag does not start with 'v' followed by a version: $ref_name"
            exit 1
          fi

          version_name=$(sed -n -E "s/^[[:space:]]*versionName([[:space:]]*=[[:space:]]*|[[:space:]]+)['\"]([^'\"]+)['\"].*$/\2/p" app/build.gradle)
          version_code=$(sed -n -E "s/^[[:space:]]*versionCode([[:space:]]*=[[:space:]]*|[[:space:]]+)([0-9]+).*$/\2/p" app/build.gradle)
          changelog_version=$(sed -n -E '/^## \[([0-9]+\.[0-9]+\.[0-9]+)\]/{ s/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*$/\1/p; q; }' CHANGELOG.md)

          if [[ -z "$version_name" ]]; then
            echo "::error::Could not extract versionName from app/build.gradle"
            exit 1
          fi

          if [[ -z "$version_code" ]]; then
            echo "::error::Could not extract versionCode from app/build.gradle"
            exit 1
          fi

          if [[ -z "$changelog_version" ]]; then
            echo "::error::Could not extract latest version from CHANGELOG.md"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG (version: $tag_version)"
          echo "app/build.gradle: versionName=$version_name, versionCode=$version_code"
          echo "CHANGELOG.md: latest version=$changelog_version"

          if [[ "$tag_version" != "$version_name" ]]; then
            echo "::error::Release tag version ($tag_version) does not match app/build.gradle versionName ($version_name)"
            exit 1
          fi

          if [[ "$tag_version" != "$changelog_version" ]]; then
            echo "::error::Release tag version ($tag_version) does not match CHANGELOG.md latest version ($changelog_version)"
            exit 1
          fi

          fastlane_file="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [[ ! -f "$fastlane_file" ]]; then
            echo "::error::Fastlane changelog file does not exist: $fastlane_file"
            exit 1
          fi

          if [[ ! -s "$fastlane_file" || -z "$(tr -d '[:space:]' < "$fastlane_file")" ]]; then
            echo "::error::Fastlane changelog file is empty: $fastlane_file"
            exit 1
          fi

          echo "Fastlane changelog verified: $fastlane_file"
          echo "Release version metadata consistency check passed!"

      - name: Check translation consistency
        run: python3 bin/check-i18n

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android build tools
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          fi
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;34.0.0"

      - name: Build unsigned release APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEEPADB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keepadb-release.p12"
          chmod 600 "$RUNNER_TEMP/keepadb-release.p12"

      - name: Sign and verify release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEEPADB_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEEPADB_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEEPADB_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          test -s "$RUNNER_TEMP/keepadb-release.p12"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/keepadb-release.p12" \
            --ks-type PKCS12 \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out KeepADB-${{ github.ref_name }}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs KeepADB-${{ github.ref_name }}.apk
          sha256sum KeepADB-${{ github.ref_name }}.apk > KeepADB-${{ github.ref_name }}.apk.sha256

      - name: Remove release keystore
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/keepadb-release.p12" ]]; then
            shred --remove=unlink "$RUNNER_TEMP/keepadb-release.p12"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeepADB ${{ github.ref_name }}
          files: |
            KeepADB-${{ github.ref_name }}.apk
            KeepADB-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
