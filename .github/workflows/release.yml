name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEEPADB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keepadb-release.p12"
          chmod 600 "$RUNNER_TEMP/keepadb-release.p12"

      - name: Build and sign release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEEPADB_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEEPADB_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEEPADB_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/keepadb-release.p12" \
            --ks-type PKCS12 \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out KeepADB-${{ github.ref_name }}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs KeepADB-${{ github.ref_name }}.apk
          sha256sum KeepADB-${{ github.ref_name }}.apk > KeepADB-${{ github.ref_name }}.apk.sha256

      - name: Remove release keystore
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/keepadb-release.p12" ]]; then
            shred --remove=unlink "$RUNNER_TEMP/keepadb-release.p12"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeepADB ${{ github.ref_name }}
          files: |
            KeepADB-${{ github.ref_name }}.apk
            KeepADB-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
