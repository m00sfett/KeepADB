plugins {
    id 'com.android.application'
}

android {
    namespace 'de.moos.wifiadb'
    compileSdk 35

    defaultConfig {
        applicationId 'de.moos.wifiadb'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
