plugins {
    id 'com.android.application'
}

android {
    namespace 'de.hohnepeople.keepadb'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'de.hohnepeople.keepadb'
        minSdk 30
        targetSdk 35
        versionCode 53
        versionName '1.5.34'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // #251: evaluated and enabled. KeepADB has zero runtime dependencies, so R8's
            // shrinker mainly trims unused platform-API wrapper code; proguard-rules.pro
            // documents what's kept and why. See CHANGELOG/README for the size comparison.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        // #286 entry step: Robolectric + androidx.test:core are a deliberate, test-scope-only
        // exception to the zero-runtime-dependency line documented at #251 (see app/build.gradle
        // comment above and AGENTS.md). They let a small, growing set of tests drive real
        // (shadowed) framework classes (ConnectivityManager, NotificationManager, ...) instead of
        // parsing production source as text. Runtime/release code stays dependency-free.
        testImplementation 'org.robolectric:robolectric:4.13'
        testImplementation 'androidx.test:core:1.6.1'
    }
}
