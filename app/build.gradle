plugins {
    id 'com.android.application'
}

android {
    namespace 'de.hohnepeople.keepadb'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'de.hohnepeople.keepadb'
        minSdk 30
        targetSdk 35
        versionCode 17
        versionName '1.4.5'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // #251: evaluated and enabled. KeepADB has zero runtime dependencies, so R8's
            // shrinker mainly trims unused platform-API wrapper code; proguard-rules.pro
            // documents what's kept and why. See CHANGELOG/README for the size comparison.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
}
