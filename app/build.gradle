plugins {
    id 'com.android.application'
}

android {
    namespace 'de.hohnepeople.keepadb'
    compileSdk 35

    defaultConfig {
        applicationId 'de.hohnepeople.keepadb'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
}
